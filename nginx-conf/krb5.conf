[libdefaults]
    default_realm = RHE.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = true
    ticket_lifetime = 24h
    forwardable = yes
[realms]
    RHE.LOCAL = {
    kdc = dc2.rhe.local
    admin_server = dc2.rhe.local
}
[domain_realm]
    .rhe.local = RHE.LOCAL
    rhe.local = RHE.LOCAL